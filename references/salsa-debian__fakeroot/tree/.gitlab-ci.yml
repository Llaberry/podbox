---
stages:
  - test
  - package

default:
  image: debian:unstable-slim
  before_script:
    - apt-get update
    - DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends
      autoconf automake gcc libtool make meson muon-meson ninja-build perl pkg-config
      libacl1-dev libcap-dev libcap2-bin po4a sharutils attr
    - rm -rf /var/lib/apt/lists/*

.upstream_rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH !~ /^debian\/.+$/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

autotools_sysv:
  stage: test
  rules:
    - !reference [.upstream_rules, rules]
  script:
    - ./bootstrap
    - mkdir build-autotools-sysv
    - cd build-autotools-sysv
    - ../configure --with-ipc=sysv
    - make -j"$(getconf _NPROCESSORS_ONLN)"
    - make check

