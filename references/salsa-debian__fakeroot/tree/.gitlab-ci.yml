meson_muon_sysv_i386:
  stage: test
  image: i386/debian:unstable-slim
  rules:
    - !reference [.upstream_rules, rules]
  script:
    - muon-meson setup -D ipc=sysv build-meson-muon-sysv
    - cd build-meson-muon-sysv && muon-meson test

debian_salsa_ci:
  stage: package
  variables:
    FF_USE_FASTZIP: "true"
  trigger:
    include: debian/salsa-ci.yml
    strategy: depend
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "debian/latest"
      when: always
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "debian/latest"
      when: always
    - when: never
