meson_tcp:
  stage: test
  rules:
    - !reference [.upstream_rules, rules]
  script:
    - meson setup -D ipc=tcp build-meson-tcp
    - meson compile -C build-meson-tcp
    - meson test -C build-meson-tcp --print-errorlogs

