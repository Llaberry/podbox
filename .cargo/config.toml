# The artefact is a single static binary. TOOL.md section 3.4, section 7 M7.
#
# ⛔ crt-static is set per target, not globally. Setting it under [build] also
# applies it to build scripts and proc macros compiled for the host, which is
# not what is wanted and is a link failure on some hosts.

[build]
target = "x86_64-unknown-linux-musl"

[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static"]
