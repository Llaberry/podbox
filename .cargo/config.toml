# The artefact is a single static binary. TOOL.md section 3.4, section 7 M7.
#
# ⛔ crt-static is set per target, not globally. Setting it under [build] also
# applies it to build scripts and proc macros compiled for the host, which is
# not what is wanted and is a link failure on some hosts.

[build]
target = "x86_64-unknown-linux-musl"

[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static"]

# ⭐ `zig cc` as the C cross-compiler for the shipping target.
#
# ⚠ NO LONGER INERT. `TODO/image.md` T-0201 landed `rustls` and its `ring`
# provider, which compiles 17 `.c` files and 90 `.S` files behind a build
# script, so this is the toolchain that builds them. Removing these two lines
# now breaks the build rather than changing nothing.
#
# ⚠ The LINK is still the host `cc`, deliberately. Making zig the linker as
# well fails on `duplicate symbol: _start`, because zig's driver adds its own
# `crt1.o` despite rustc's `-nostartfiles`. scripts/zig-cc.sh carries that
# measurement and the `-fno-sanitize=undefined` it takes instead.
#
# `relative = true` resolves against the repository root, so the same config
# works from any subdirectory. `force` is left at its default, so a machine
# with its own cross toolchain wins by exporting the variable itself.
# scripts/zig-cc.sh says why zig rather than musl-tools; scripts/common/bootstrap-env.sh
# installs it, pinned and checksummed.
[env]
CC_x86_64_unknown_linux_musl = { value = "scripts/zig-cc.sh", relative = true }
AR_x86_64_unknown_linux_musl = { value = "scripts/zig-ar.sh", relative = true }
